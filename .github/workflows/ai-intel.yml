name: AI threat intel
# Needs an AI key (see secrets below). Every 3 hours: read security feeds -> AI extracts indicators -> deterministic validator -> av-db/ai-approved.json
# -> triggers "Update AV database", which builds, signs and publishes the av-db branch the app downloads.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Only test the AI with ONE built-in sample report (1 request, saves nothing)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write    # to start "Update AV database" after new records
concurrency:
  group: ai-intel
  cancel-in-progress: false
jobs:
  intel:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"   # do not touch tracked .pyc files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator self-test (offline)
        run: python3 av-db/ai/test_validate.py
      - name: Collect + AI analysis + validation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # option 1 (Anthropic)
          AI_API_KEY: ${{ secrets.AI_API_KEY }}                  # option 2: any OpenAI-compatible provider
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}                   #   e.g. https://api.example.com/v1
          AI_MODEL: ${{ vars.AI_MODEL }}                         #   model name (optional for Anthropic)
          AI_MAX_ITEMS: ${{ vars.AI_MAX_ITEMS }}                 # optional cap per run (default 40)
          AI_SELFTEST: ${{ inputs.selftest }}
          AI_DELAY: ${{ vars.AI_DELAY }}                         # optional seconds between calls (Gemini default 7)
        run: python3 av-db/ai/ai_intel.py
      - name: Commit new records
        id: commit
        run: |
          git config user.name "payesh-ai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add av-db/ai-approved.json av-db/ai-meta.json av-db/ai/rules-proposed.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "AI intel update [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild + sign + publish the database now
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-av-db.yml
