name: Update AV database
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout data branch (av-db)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" av-db >/dev/null 2>&1; then
            git clone --depth 1 --branch av-db "$URL" db
          else
            mkdir db && cd db && git init -q -b av-db && git remote add origin "$URL"
          fi

      - name: Collect, validate and build
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          pip install pyyaml
          python3 src/av-db/build_db.py src/av-db/custom.json db

      - name: Sign manifest
        env:
          AV_SIGNING_KEY: ${{ secrets.AV_SIGNING_KEY }}
        run: |
          cd db
          if [ -z "$AV_SIGNING_KEY" ]; then echo "AV_SIGNING_KEY not set: publishing without signature"; exit 0; fi
          if [ -z "$(git status --porcelain -- manifest.json)" ] && [ -f manifest.sig ]; then echo "manifest unchanged"; exit 0; fi
          printf '%s\n' "$AV_SIGNING_KEY" > "$RUNNER_TEMP/av.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/av.pem" -out "$RUNNER_TEMP/sig.bin" manifest.json
          base64 -w0 "$RUNNER_TEMP/sig.bin" > manifest.sig
          if [ -f ../src/app/src/main/assets/av-pub.pem ]; then
            openssl dgst -sha256 -verify ../src/app/src/main/assets/av-pub.pem -signature "$RUNNER_TEMP/sig.bin" manifest.json
          fi
          rm -f "$RUNNER_TEMP/av.pem"

      - name: Publish to av-db branch
        run: |
          cd db
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "payesh-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "Update AV database"
            git push origin HEAD:av-db
          fi
