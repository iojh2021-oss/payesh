name: Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - "av-db/**"
  workflow_dispatch:
permissions:
  contents: write   # needed to publish the update release
concurrency:
  group: build-apk
  cancel-in-progress: false   # a newer push waits instead of killing a build that is publishing the release
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust
      - name: Rust unit tests (host)
        working-directory: app/src/main/rust
        run: cargo test --release
      - name: Build Rust engine for Android
        working-directory: app/src/main/rust
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 29 -o ../jniLibs build --release
      - name: Bundle latest published AV database into the APK (best effort)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${{ github.repository }}/av-db/av-db.json" -o /tmp/av-db.json
          python3 - <<'PY'
          import json, shutil
          d = json.load(open('/tmp/av-db.json'))
          assert d.get('schema') in (1, 2)
          assert len(d.get('hashes', {})) > 100 and len(d.get('domains', {})) > 10
          shutil.copy('/tmp/av-db.json', 'app/src/main/assets/av-db.json')
          print('bundled AV database version', d.get('version'))
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Stable signing key (so updates install over the old app)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/payesh.keystore"
            echo "PAYESH_KEYSTORE=$RUNNER_TEMP/payesh.keystore" >> "$GITHUB_ENV"
            echo "PAYESH_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "Using the fixed signing key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: this APK gets a random debug key and cannot be installed over an older one. Run tools/make-keystore.sh once."
          fi
      - run: gradle assembleDebug --no-daemon
      - name: Publish update release (APK, update.json, post-quantum signature)
        env:
          GH_TOKEN: ${{ github.token }}
          AV_MLDSA_KEY: ${{ secrets.AV_MLDSA_KEY }}
        run: |
          cp app/build/outputs/apk/debug/*.apk payesh.apk
          python3 - <<'PY'
          import json, os, hashlib, subprocess
          sha = hashlib.sha256(open('payesh.apk', 'rb').read()).hexdigest()
          vc = int(os.environ['GITHUB_RUN_NUMBER'])
          notes = subprocess.check_output(['git', 'log', '-1', '--pretty=%s']).decode().strip()[:200]
          repo = os.environ['GITHUB_REPOSITORY']
          json.dump({"kind": "app-update", "package": "app.payesh", "versionCode": vc, "versionName": "1.0.%d" % vc,
                     "sha256": sha, "size": os.path.getsize('payesh.apk'),
                     "url": "https://github.com/%s/releases/download/latest/payesh.apk" % repo, "notes": notes},
                    open('update.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          PY
          if [ -n "$AV_MLDSA_KEY" ]; then
            printf '%s\n' "$AV_MLDSA_KEY" > mldsa.pem
            if openssl list -signature-algorithms 2>/dev/null | grep -qi 'ML-DSA-65'; then
              sh av-db/tools/mldsa-sign.sh mldsa.pem update.json update.json.mldsa av-db/pq/av-pub-mldsa65.pem || echo "::warning::ML-DSA signing of update.json failed"
            else
              docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -c 'apk add --no-cache openssl >/dev/null && sh av-db/tools/mldsa-sign.sh mldsa.pem update.json update.json.mldsa av-db/pq/av-pub-mldsa65.pem' || echo "::warning::ML-DSA signing of update.json failed"
            fi
            rm -f mldsa.pem
          fi
          FILES="payesh.apk update.json"
          [ -f update.json.mldsa ] && FILES="$FILES update.json.mldsa"
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest $FILES --target "$GITHUB_SHA" --title "Payesh 1.0.$GITHUB_RUN_NUMBER" --notes "Automatic build $GITHUB_RUN_NUMBER (in-app updater feed)"
      - uses: actions/upload-artifact@v4
        with:
          name: payesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
